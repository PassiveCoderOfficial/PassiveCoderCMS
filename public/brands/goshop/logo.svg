<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" role="img" aria-label="Go Shop">
  <defs>
    <linearGradient id="gs-bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#E03E00"/>
    </linearGradient>
  </defs>
  <!-- Mark: a shopping bag whose handle sweeps forward into a motion arc,
       reading as "go". Holds up at favicon size as a plain bag. -->
  <g>
    <path d="M7 15h30l-3 24.2A4 4 0 0 1 30 43H14a4 4 0 0 1-4-3.8L7 15Z" fill="url(#gs-bag)"/>
    <path d="M16 17v-5.5a6 6 0 0 1 12 0V17" fill="none" stroke="#1A1330"
          stroke-width="3.2" stroke-linecap="round"/>
    <path d="M17.5 27.5h10.5m-4-4 4 4-4 4" fill="none" stroke="#FFFFFF"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="48" y="31" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="25" font-weight="800" letter-spacing="-0.9" fill="#1A1330">Go<tspan fill="#FF5A1F">Shop</tspan></text>
</svg>
