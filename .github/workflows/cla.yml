# Contributor License Agreement check (CLA.md).
# On every pull request it checks that each author has accepted the CLA. To
# accept, the author posts this exact comment on the pull request:
#   I have read the Passive Coder Contributor License Agreement version 1.0 and I accept it.
# Signatures are stored in this repository, on the "cla-signatures" branch.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Passive Coder Contributor License Agreement version 1.0 and I accept it.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: PassiveCoderOfficial,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Passive Coder Contributor License Agreement version 1.0 and I accept it.
          custom-notsigned-prcomment: Thank you for your contribution. Before we can merge it, please accept our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md) by posting the comment below on this pull request. You only need to do this once.
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you.
          lock-pullrequest-aftermerge: false
